services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret}
      S3_BUCKET: ${S3_BUCKET:-poc}
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # Master UI
      - "8888:8888" # Filer UI
      - "7333:7333" # WebDAV
      - "9340:9340" # Volume server
      - "23646:23646" # Admin UI
    volumes:
      - ./seaweed-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9333/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped
