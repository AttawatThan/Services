# Minimal Airflow 3.2.2 configuration. Runtime-specific and secret values are
# supplied by docker-compose.yaml environment variables.

[core]
dags_folder = /opt/airflow/dags
plugins_folder = /opt/airflow/plugins
executor = LocalExecutor
auth_manager = airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
default_timezone = Asia/Bangkok
parallelism = 2
dags_are_paused_at_creation = True
load_examples = False
sensitive_var_conn_names = credential
test_connection = Enabled
execution_api_server_url = http://airflow-apiserver:8080/execution/

[api]
base_url = http://localhost:8080

[scheduler]
enable_health_check = True

[dag_processor]
refresh_interval = 60

[email]
default_email_on_failure = False
default_email_on_retry = False
